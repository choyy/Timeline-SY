<head>
    <script src="timeline3/js/timeline.js"></script>
    <script src="manipulations.js"></script>
</head>

<body>
    <link rel="stylesheet" id="timelinetheme" href="timeline3/css/timeline.css">
    <div id="Timeline">
        <script src="init.js"></script>
    </div>
    <div id="button-element" style="top: 200px;right: 30px;position: absolute;z-index: 999;">
        <input type="button" value="Create" class="tl-blue-button" onclick="addSlide();">
        <input type="button" value="Edit" class="tl-blue-button" onclick="editSlide();">
        <input type="button" value="Delete" class="tl-red-button" onclick="deleteSlide()">
        <li class="list-father">...
            <ul class="list-son">
                <li><input type="button" value="Epoch" class="tl-blue-button" onclick="eraPanelShow();"
                        style="margin-left: 40px;"></li>
                <li><input type="button" value="Toggle full screen" class="tl-blue-button" onclick="setFullscreen();"
                        style="margin-left: 13px;"></li>
                <li><input type="button" value="Group rename" class="tl-blue-button" onclick="groupRename()"></li>
                <li><input type="button" value="Open in browser" class="tl-red-button"
                        onclick="window.open(window.location.href+`?blockid=${window.baseid}`)"></li>
                <li><input type="button" value="Refresh timeline" class="tl-red-button" onclick="timelineReload()"></li>
                <li><input type="button" value="Timeline settings" class="tl-red-button" onclick="timelineSettingsShow()"></li>
            </ul>
        </li>
    </div>
    <div id="light" class="white_content">
        <div id="date_area">
            <b>Start date：</b>
            <input type="number" name="" id="start_year" value="" class="tl-year-field" />Year
            <input type="number" name="" id="start_month" value="" min="1" max="12" class="tl-md-field" />Month
            <input type="number" name="" id="start_day" value="" min="1" max="31" class="tl-md-field" />Day
            <input type="number" name="" id="start_hour" value="" min="0" max="23" class="tl-md-field" />Hour
            <input type="number" name="" id="start_minute" value="" min="0" max="59" class="tl-md-field" />Minute
            <input type="number" name="" id="start_second" value="" min="0" max="59" class="tl-md-field" />Second</br>
            <div class="tl-block"></div>
            End date：
            <input type="number" name="" id="end_year" value="" class="tl-year-field" />Year
            <input type="number" name="" id="end_month" value="" min="1" max="12" class="tl-md-field" />Month
            <input type="number" name="" id="end_day" value="" min="1" max="31" class="tl-md-field" />Day
            <input type="number" name="" id="end_hour" value="" min="0" max="23" class="tl-md-field" />Hour
            <input type="number" name="" id="end_minute" value="" min="0" max="59" class="tl-md-field" />Minute
            <input type="number" name="" id="end_second" value="" min="0" max="59" class="tl-md-field" />Second</br>
        </div>
        <div class="tl-block"></div>
        <div>
            <span style="padding-left: 32px;"><b>Title：</b></span>
            <input type="text" name="" id="slide_title" value="" class="tl-text-field" /></br>
        </div>
        <div class="tl-block"></div>
        <div>
            <span style="padding-left: 32px;">Group：</span>
            <input id="input_group" list="group_list" class="tl-text-field"/>
            <datalist id="group_list">
            </datalist>
        </div>
        <div class="tl-block"></div>
        <div>
            <span style="padding-left: 32px;vertical-align: top;">Description：</span>
            <textarea name="" id="slide_contents" rows="5" class="tl-text-field"></textarea></br>
        </div>
        <div class="tl-block"></div>
        Background image：<input type="text" name="" id="slide_background" class="tl-text-field" style="margin-left: 3px;" /></br>
        <div class="tl-block"></div>
        Source block id：<input type="text" name="" id="slide_blockid" class="tl-text-field" style="margin-left: 2px;" /></br>

        <div class="tl-block"></div>
        <div class="tl-block"></div>
        <!-- Confirm, cancel buttons -->
        <div class="tl_button" style="text-align: right;">
            <button onclick="confirmCancel()" id="confirm_button_cancel" class="tl-red-button"
                style="margin-right: 30px; font-size: 16px;">Cancel</button>
            <button onclick="confirmYes()" id="confirm_button_yes" class="tl-blue-button"
                style="font-size: 16px;">Confirm</button>
        </div>
    </div>
    <div id="tl_era_panel" class="tl_era_panel">
        <div id="vote">
            <div id="era-item">
                <input type="number" class="tl-year-field" id="start_date" name="era_start_date" />
                Year ～
                <input type="number" class="tl-year-field" id="end_date" name="era_end_date" />
                Year：
                <input type="text" class="tl-era-title-field" placeholder="Era title" name="era_title" />
                <button id="del-era-item">-</button>
                <div class="tl-block"></div>
            </div>
            <div id="position-sign"></div>
        </div>
        <button id="button" class="tl-blue-button" onclick="eraInputAdd()" style="margin-top: -2px;">Add</button>

        <div class="tl_button" style="text-align: right;">
            <button onclick="eraConfirmCancel()" id="confirm_button_cancel" class="tl-red-button"
                style="margin-right: 30px;font-size: 16px;">Cancel</button>
            <button onclick="eraConfirmYes()" id="confirm_button_yes" class="tl-blue-button"
                style="font-size: 16px;">Confirm</button>
        </div>
    </div>
    <div id="tl_settings_panel" class="tl_era_panel">
        Timeline height：<input type="number" id="timenav_height_percentage" min="0" max="101" class="tl-md-field"
            style="width: 64px;" />%
        <div class="tl-block"></div>
        Timeline start position：
        <select name="" id="start_location" class="tl-text-field" style="width: 100px;">
            <option value="0">First item</option>
            <option value="1">Last item</option>
        </select>
        <div class="tl-block"></div>
        Timeline position：
        <select name="" id="timenav_position" class="tl-text-field" style="width: 100px;">
            <option value="0">Top</option>
            <option value="1">Bottom</option>
        </select>
    
        <div class="tl_button" style="text-align: right;">
            <button onclick="tlsettingsConfirmCancel()" id="confirm_button_cancel" class="tl-red-button"
                style="margin-right: 30px;font-size: 16px;">Cancel</button>
            <button onclick="tlsettingsConfirmYes()" id="confirm_button_yes" class="tl-blue-button"
                style="font-size: 16px;">Confirm</button>
        </div>
    </div>
    <div id="tl_group_rename_panel" class="tl_era_panel">
        <div class="tl-block"></div>
        Rename
        <select id="group_select" class="tl-text-field" style="width: 40%;" >
        </select>
        As
        <input id="group_renamed" class="tl-text-field" style="width: 40%;" />
        <div class="tl-block"></div>

        <div class="tl_button" style="text-align: right;">
            <button onclick="groupConfirmCancel()" id="confirm_button_cancel" class="tl-red-button"
                style="margin-right: 30px;font-size: 16px;">Cancel</button>
            <button onclick="groupConfirmYes()" id="confirm_button_yes" class="tl-blue-button"
                style="font-size: 16px;">Confirm</button>
        </div>
    </div>
    <div id="fade" class="black_overlay"></div>
    <script>
        // Fill in the default value for the start date
        var init_date = new Date();
        document.getElementById("start_year").value = init_date.getFullYear();
        document.getElementById("start_month").value = init_date.getMonth() + 1;
        document.getElementById("start_day").value = init_date.getDate();
    </script>
    <script>
        // Disable mouse wheel when adjusting date
        var box = document.getElementById("date_area")
        function onMouseWheel(ev) {
            return false;
        }
        addEvent(box, 'mousewheel', onMouseWheel);
        addEvent(box, 'DOMMouseScroll', onMouseWheel);
        function addEvent(obj, xEvent, fn) {
            if (obj.attachEvent) {
                obj.attachEvent('on' + xEvent, fn);
            } else {
                obj.addEventListener(xEvent, fn, false);
            }
        }
        box.addEventListener('mouseover', function () {
            box.onMouseWheel = () => {
                return true;
            }
        })
    </script>
</body>

</html>
